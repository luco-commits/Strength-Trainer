<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Strength Trainer</title><style>
:root{--bg:#07111f;--panel:#0d1d31;--panel2:#122a45;--line:#254562;--muted:#a5b9ce;--blue:#1677ff;--green:#25c98b;--purple:#8b6cff;--orange:#ff9533}*{box-sizing:border-box}body{margin:0;color:#f6f9fd;background:radial-gradient(circle at 75% 0,#123762 0,#07111f 35%);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:20px 20px 70px}.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 22px}.brand{font-size:23px;font-weight:850}.brand span{color:#58a0ff}.header button,.btn{border:0;border-radius:12px;background:#173652;color:white;padding:12px 17px;font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue)}.btn.green{background:var(--green);color:#042218}.view{display:none}.view.active{display:block}.hero{position:relative;min-height:390px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:url('images/floor-press.webp') center/cover;box-shadow:0 18px 50px #0005}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#06111ff4 0,#06111fce 43%,#06111f1c 80%)}.heroText{position:relative;z-index:1;padding:48px;max-width:620px}.eyebrow{color:#70adff;font-weight:800;letter-spacing:.1em;font-size:12px}.hero h1{font-size:clamp(36px,7vw,62px);line-height:1.03;margin:11px 0 17px}.muted,p{color:var(--muted);line-height:1.55}.stats,.weeks,.phases{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,1fr);margin:15px 0}.card{background:linear-gradient(145deg,var(--panel),#0a192a);border:1px solid var(--line);border-radius:17px;padding:20px}.stat b{font-size:28px;display:block}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:28px 0 13px}.sectionHead h2{margin:0}.weeks{grid-template-columns:repeat(10,1fr)}.weekBtn{background:var(--panel);color:white;border:1px solid var(--line);border-radius:12px;padding:14px 5px;cursor:pointer}.weekBtn.active{background:var(--blue);border-color:var(--blue)}.weekBtn.done{box-shadow:inset 0 -4px var(--green)}.weekPanel{margin-top:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.day{background:#10243a;color:white;border:1px solid var(--line);border-radius:12px;padding:13px 8px;min-height:93px;cursor:pointer;text-align:left}.day.done{border-color:var(--green);background:#0c312a}.day.next{outline:2px solid var(--blue)}.phases{grid-template-columns:repeat(3,1fr)}.phase{border-top:4px solid var(--blue)}.phase:nth-child(2){border-color:var(--green)}.phase:nth-child(3){border-color:var(--purple)}.progressbar{height:10px;border-radius:10px;background:#06101c;overflow:hidden}.progressbar i{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--green))}.screen{max-width:790px;margin:auto}.workTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.visual{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0c1a2c}.visual img{width:100%;height:min(50vh,430px);object-fit:cover;display:block}.visualLabel{position:absolute;left:16px;bottom:16px;background:#06111fd9;border:1px solid #ffffff2b;border-radius:12px;padding:10px 13px}.stepCard{text-align:center;margin-top:13px}.rep{font-size:clamp(70px,18vw,130px);font-weight:900;line-height:1;color:white;margin:10px}.repLabel{color:#6eafff;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.action{width:100%;padding:18px;font-size:20px;margin-top:13px}.subactions{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.subactions button{flex:1}.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:16px 0}.dot{width:9px;height:9px;border-radius:50%;background:#34506b}.dot.done{background:var(--green)}.dot.now{background:var(--blue);transform:scale(1.5)}.rest{font-size:clamp(70px,18vw,125px);font-weight:900;margin:20px;text-align:center}.complete{text-align:center;padding:45px 20px}.completeMark{font-size:75px}.exercisePreview{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;margin-top:10px}.exercisePreview img{width:110px;height:78px;object-fit:cover;border-radius:10px}.notice{background:#332711;border:1px solid #74531a;color:#f5dda6;padding:13px;border-radius:10px}.scheduleActions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.btn.warn{background:#7a5218}.btn.danger{background:#8f2d3a}.confirmText{font-size:13px;color:var(--muted);margin-top:10px}@media(max-width:650px){.scheduleActions{grid-template-columns:1fr}}.restOverlay{position:fixed;inset:0;background:#020812d9;backdrop-filter:blur(7px);z-index:50;display:grid;place-items:center;padding:20px}.restOverlayBox{width:min(420px,100%);background:linear-gradient(145deg,#102a47,#091827);border:1px solid #31577a;border-radius:23px;padding:30px;text-align:center;box-shadow:0 25px 80px #000a}.restOverlay .rest{margin:14px 0}.restOverlay .btn{width:100%;margin-top:10px} @media(max-width:760px){.wrap{padding:12px 12px 55px}.header{padding-bottom:12px}.hero{min-height:520px;background-position:62% center}.heroText{padding:30px 24px}.stats{grid-template-columns:repeat(2,1fr)}.weeks{grid-template-columns:repeat(5,1fr)}.days{grid-template-columns:repeat(2,1fr)}.phases{grid-template-columns:1fr}.visual img{height:38vh;min-height:270px}.exercisePreview{grid-template-columns:90px 1fr}.exercisePreview img{width:90px}.workTop h2{font-size:18px}.hideMobile{display:none}}
</style></head><body><div class="wrap"><header class="header"><div class="brand">Strength <span>Trainer</span></div><button id="homeBtn" onclick="returnHome()" style="display:none">Exit workout</button></header><main><section id="home" class="view active"></section><section id="runner" class="view"><div class="screen" id="run"></div></section></main></div><script>
const E={push:[{id:'floor-press',n:'Dumbbell Floor Press',g:'Chest and triceps',how:'Lie on your back with knees bent. Press both dumbbells above your chest, then lower until your upper arms gently touch the floor.'},{id:'shoulder-press',n:'Standing Shoulder Press',g:'Shoulders and triceps',how:'Brace your core and press both dumbbells overhead. Lower under control without leaning backwards.'},{id:'chest-fly',n:'Dumbbell Chest Fly',g:'Chest',how:'Lie on your back with soft elbows. Open your arms slowly, then bring the dumbbells together above your chest.'},{id:'lateral-raise',n:'Lateral Raise',g:'Side shoulders',how:'Stand tall and raise the dumbbells out to the sides until near shoulder height. Lower slowly.'},{id:'triceps-extension',n:'Overhead Triceps Extension',g:'Triceps',how:'Hold one dumbbell overhead. Lower it behind your head by bending your elbows, then straighten your arms.'},{id:'wall-pushup',n:'Incline Wall Push Up',g:'Chest, shoulders and triceps',how:'Place your hands on a wall and keep a straight body line. Lower your chest towards the wall, then press away.'}],pull:[{id:'one-arm-row',n:'One Arm Dumbbell Row',g:'Back and biceps',how:'Support one hand on a sturdy chair. Pull the dumbbell towards your hip, pause, then lower slowly.'},{id:'pullover',n:'Dumbbell Pullover',g:'Chest, back and core',how:'Lie on your back. Lower one dumbbell behind your head within a comfortable range, then return above your chest.'},{id:'reverse-fly',n:'Reverse Fly',g:'Rear shoulders and upper back',how:'Hinge at your hips with a neutral back. Open your arms out wide, then lower slowly.'},{id:'biceps-curl',n:'Dumbbell Biceps Curl',g:'Biceps',how:'Keep your elbows close to your sides. Curl the dumbbells towards your shoulders and lower fully.'},{id:'hammer-curl',n:'Hammer Curl',g:'Biceps and forearms',how:'Keep your palms facing inward. Curl the dumbbells while keeping your elbows still.'},{id:'rear-delt-row',n:'Rear Delt Row',g:'Rear shoulders and upper back',how:'Hinge forward and pull your elbows out wide. Pause briefly, then lower with control.'}]};
const PH=[{n:'Foundation',range:'Weeks 1–3',sets:3,reps:12,rest:45},{n:'Progression',range:'Weeks 4–7',sets:4,reps:15,rest:45},{n:'Peak',range:'Weeks 8–10',sets:5,reps:18,rest:45}];let S=JSON.parse(localStorage.getItem('strengthGuidedV8')||'{"days":{},"work":null,"week":1}');let timer=null;const save=()=>localStorage.setItem('strengthGuidedV8',JSON.stringify(S));const ph=w=>w<=3?PH[0]:w<=7?PH[1]:PH[2];const type=d=>d===3||d===6?'Recovery':d%2?'Push':'Pull';const dk=(w,d)=>`${w}-${d}`;function isDone(w,d){return !!S.days[dk(w,d)]}function next(){for(let w=1;w<=10;w++)for(let d=1;d<=7;d++)if(!isDone(w,d))return [w,d];return null}function totals(){let d=Object.values(S.days).filter(Boolean).length;return [d,Math.round(d/70*100)]}
function renderHome(){let [days,pc]=totals(),n=next(),sel=S.week||1,p=ph(sel);homeView.innerHTML=`<div class="hero"><div class="heroText"><div class="eyebrow">GUIDED 10 WEEK PROGRAM</div><h1>Your next workout, one step at a time.</h1><p>Press begin and the trainer will guide every repetition, set and exercise until the session is complete.</p><button class="btn primary" onclick="${n?`begin(${n[0]},${n[1]})`:`alert('Program complete')`}">${n?`Begin next workout · Week ${n[0]}, Day ${n[1]}`:'Program complete'}</button></div></div><div class="stats"><div class="card stat"><b>${pc}%</b><span class="muted">Program complete</span></div><div class="card stat"><b>${days}/70</b><span class="muted">Days complete</span></div><div class="card stat"><b>${n?'Week '+n[0]:'10'}</b><span class="muted">Current week</span></div><div class="card stat"><b>${n?type(n[1]):'Done'}</b><span class="muted">Next session</span></div></div><div class="sectionHead"><div><h2>Weekly progress</h2><p>Select any week to review or repeat a workout.</p></div></div><div class="weeks">${Array.from({length:10},(_,i)=>{let w=i+1,done=Array.from({length:7},(_,j)=>isDone(w,j+1)).every(Boolean);return `<button class="weekBtn ${w===sel?'active':''} ${done?'done':''}" onclick="S.week=${w};save();renderHome()">${w}</button>`}).join('')}</div><div class="card weekPanel"><h2>Week ${sel}: ${p.n}</h2><p>${p.sets} sets × ${p.reps} repetitions · ${p.rest} second rests</p><div class="days">${Array.from({length:7},(_,i)=>{let d=i+1,t=type(d),isn=n&&n[0]===sel&&n[1]===d;return `<button class="day ${isDone(sel,d)?'done':''} ${isn?'next':''}" onclick="begin(${sel},${d})"><b>Day ${d}</b><p>${t}</p><span>${isDone(sel,d)?'✓ Complete':isn?'Next workout':'Open'}</span></button>`}).join('')}</div><div class="scheduleActions"><button class="btn" onclick="resetDayPrompt(${sel})">Reset a day</button><button class="btn warn" onclick="goBackDay()">Go back one day</button><button class="btn danger" onclick="resetSchedule()">Reset full schedule</button></div><div class="confirmText">Reset a day lets you choose a completed day in this week. Go back one day reopens the most recently completed day.</div></div><div class="sectionHead"><h2>Program phases</h2></div><div class="phases">${PH.map(x=>`<div class="card phase"><p>${x.range}</p><h3>${x.n}</h3><p>${x.sets} sets × ${x.reps} repetitions<br>${x.rest} seconds rest</p></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="notice">Stop if you experience sharp pain, dizziness, chest discomfort or unusual shortness of breath. Seek professional advice before training if you have an injury or health concern.</div></div>`}
function resetDayPrompt(w){let completed=[];for(let d=1;d<=7;d++)if(isDone(w,d))completed.push(d);if(!completed.length){alert('There are no completed days to reset in Week '+w+'.');return}let answer=prompt('Enter the completed day to reset in Week '+w+': '+completed.join(', '));if(answer===null)return;let d=Number(answer);if(!completed.includes(d)){alert('Please enter one of these completed days: '+completed.join(', '));return}if(confirm('Reset Week '+w+', Day '+d+'?')){delete S.days[dk(w,d)];S.work=null;save();renderHome()}}function goBackDay(){let last=null;for(let w=1;w<=10;w++)for(let d=1;d<=7;d++)if(isDone(w,d))last=[w,d];if(!last){alert('No completed day is available to reopen.');return}if(confirm('Reopen Week '+last[0]+', Day '+last[1]+'?')){delete S.days[dk(last[0],last[1])];S.week=last[0];S.work=null;save();renderHome()}}function resetSchedule(){if(confirm('Reset the complete 10 week schedule? All completed days and the current workout will be removed.')){if(confirm('This cannot be undone. Reset everything?')){S={days:{},work:null,week:1};save();renderHome()}}}function begin(w,d){clearInterval(timer);let t=type(d);if(t==='Recovery'){S.work={w,d,stage:'recovery'};save()}else{S.work={w,d,stage:'exercise',ex:0,set:1,rep:1};save()}showRunner()}const homeView=document.getElementById('home'),runnerView=document.getElementById('runner'),runView=document.getElementById('run'),homeButton=document.getElementById('homeBtn');function showRunner(){homeView.classList.remove('active');runnerView.classList.add('active');homeButton.style.display='block';draw()}function returnHome(){clearInterval(timer);let overlay=document.getElementById('restOverlay');if(overlay)overlay.remove();runnerView.classList.remove('active');homeView.classList.add('active');homeButton.style.display='none';renderHome()}
function draw(){let q=S.work,w=q.w,d=q.d,p=ph(w),t=type(d),arr=t==='Push'?E.push:E.pull;if(q.stage==='recovery'){runView.innerHTML=`<div class="complete"><div class="completeMark">☀</div><h1>Recovery day</h1><p>Take an easy walk and complete gentle shoulder mobility. Prioritise hydration and sleep.</p><button class="btn green action" onclick="finishDay()">Mark recovery complete</button></div>`;return}if(q.stage==='rest')return drawRest();if(q.stage==='complete'){runView.innerHTML=`<div class="complete"><div class="completeMark">✓</div><h1>Workout complete</h1><p>Week ${w}, Day ${d} is complete. Great work following every repetition and set.</p><button class="btn green action" onclick="finishDay()">Save and return to overview</button></div>`;return}let e=arr[q.ex],total=arr.length*p.sets,done=(q.ex*p.sets)+(q.set-1),pct=Math.round(done/total*100);runView.innerHTML=`<div class="workTop"><div><span class="eyebrow">WEEK ${w} · DAY ${d} · ${t.toUpperCase()}</span><h2>${e.n}</h2></div><b>${q.ex+1}/${arr.length}</b></div><div class="progressbar"><i style="width:${pct}%"></i></div><div class="dots">${arr.map((_,i)=>`<i class="dot ${i<q.ex?'done':i===q.ex?'now':''}"></i>`).join('')}</div><div class="visual"><img src="images/${e.id}.webp" alt="Demonstration of ${e.n}"><div class="visualLabel"><b>${e.g}</b></div></div><div class="card stepCard"><div class="repLabel">Set ${q.set} of ${p.sets}</div><div class="rep">${p.reps}</div><p class="repLabel">repetitions</p><p>${e.how}</p><button class="btn primary action" onclick="doneSet()">Done · complete set</button><div class="subactions"><button class="btn" onclick="backStep()">Previous</button><button class="btn" onclick="skipExercise()">Skip exercise</button></div></div>`}
function doneSet(){let q=S.work,p=ph(q.w),arr=type(q.d)==='Push'?E.push:E.pull;if(q.set<p.sets){q.stage='rest';q.remaining=p.rest;q.nextSet=q.set+1}else if(q.ex<arr.length-1){q.stage='rest';q.remaining=p.rest;q.nextExercise=q.ex+1}else q.stage='complete';save();draw()}function backStep(){let q=S.work,p=ph(q.w);if(q.set>1){q.set--}else if(q.ex>0){q.ex--;q.set=p.sets}save();draw()}function skipExercise(){let q=S.work,arr=type(q.d)==='Push'?E.push:E.pull;if(q.ex<arr.length-1){q.ex++;q.set=1;q.rep=1}else q.stage='complete';save();draw()}
let audioContext=null;function playCountdownTone(second){try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();let now=audioContext.currentTime,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='square';osc.frequency.setValueAtTime(second===1?1100:820,now);gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.22,now+0.01);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.16);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+0.18)}catch(e){}}function drawRest(){clearInterval(timer);let q=S.work;q.stage='exercise';draw();q.stage='rest';save();document.body.insertAdjacentHTML('beforeend',`<div class="restOverlay" id="restOverlay"><div class="restOverlayBox"><div class="eyebrow">REST BETWEEN SETS</div><div class="rest" id="count">${q.remaining}</div><p>The current exercise stays visible behind the timer. The next set will open automatically.</p><button class="btn primary" onclick="endRest()">Skip rest</button></div></div>`);timer=setInterval(()=>{q.remaining--;save();let c=document.getElementById('count');if(c)c.textContent=q.remaining;if(q.remaining<=5&&q.remaining>=1)playCountdownTone(q.remaining);if(q.remaining<=0){clearInterval(timer);endRest()}},1000)}function endRest(){clearInterval(timer);let overlay=document.getElementById('restOverlay');if(overlay)overlay.remove();let q=S.work;q.stage='exercise';if(q.nextExercise!==undefined){q.ex=q.nextExercise;q.set=1;q.rep=1;delete q.nextExercise}else{q.set=q.nextSet;q.rep=1;delete q.nextSet}delete q.remaining;save();draw()}function finishDay(){let q=S.work;S.days[dk(q.w,q.d)]=true;S.week=q.w;S.work=null;save();returnHome()}renderHome();if(S.work)showRunner();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
