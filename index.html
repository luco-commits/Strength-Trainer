<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Strength Trainer</title><style>
:root{--bg:#07111f;--panel:#0d1d31;--panel2:#112944;--line:#24425f;--muted:#9fb3c9;--blue:#1677ff;--green:#24c58b;--purple:#8467ff;--orange:#ff912e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#102e52 0,#07111f 35%);color:#f5f8fc;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:230px;background:#071421;border-right:1px solid var(--line);padding:24px 15px;z-index:3}.brand{font-size:21px;font-weight:800;padding:8px 12px 25px}.brand span{color:var(--blue)}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#c6d4e4;padding:13px;border-radius:10px;margin:3px 0;font-weight:650;cursor:pointer}.nav button.active,.nav button:hover{background:#12365e;color:#64a7ff}.main{margin-left:230px;padding:28px;max-width:1400px}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1,h2,h3,p{margin-top:0}.muted,p{color:var(--muted);line-height:1.5}.hero{min-height:270px;border-radius:22px;overflow:hidden;position:relative;background:url('images/floor-press.webp') center 42%/cover}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#07111ff5 0,#07111fc7 42%,#07111f20 78%)}.heroText{position:relative;z-index:1;padding:38px;max-width:570px}.hero h1{font-size:44px;margin-bottom:10px}.btn{border:0;border-radius:11px;padding:12px 17px;background:#173553;color:white;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue)}.stats,.grid,.phases{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr);margin:16px 0}.card{background:linear-gradient(145deg,var(--panel),#0b192b);border:1px solid var(--line);border-radius:17px;padding:20px}.stat b{font-size:27px;display:block;margin:8px 0}.stat .ico{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#173b68;color:#6aadff}.phases{grid-template-columns:repeat(3,1fr)}.phase{border-top:3px solid var(--blue)}.phase:nth-child(2){border-color:var(--green)}.phase:nth-child(3){border-color:var(--purple)}.week{margin-bottom:10px}.weekhead{width:100%;display:flex;justify-content:space-between;border:1px solid var(--line);background:var(--panel);color:white;padding:15px;border-radius:13px;cursor:pointer}.days{display:none;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}.week.open .days{display:grid}.day{padding:12px;background:#10243a;border:1px solid var(--line);border-radius:12px;cursor:pointer;min-height:90px}.day.done{border-color:var(--green);background:#0d312b}.exerciseList{display:grid;gap:12px}.exercise{display:grid;grid-template-columns:190px 1fr auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.exercise img{width:190px;height:145px;object-fit:cover}.exercise .info{padding:16px}.exercise .sets{padding:16px;display:flex;gap:7px;align-items:center}.set{width:39px;height:39px;border:1px solid #4b6e91;border-radius:50%;background:#07192b;color:white}.set.done{background:var(--green);border-color:var(--green);color:#042018}.library{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.excard{padding:0;overflow:hidden;cursor:pointer}.excard img{width:100%;height:160px;object-fit:cover}.excard div{padding:15px}.bar{height:10px;border-radius:8px;background:#06101c;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.bottom{display:none}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9;padding:20px;overflow:auto}.modal.open{display:grid;place-items:center}.modalbox{max-width:750px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.modalbox img{width:100%;max-height:370px;object-fit:cover}.modalbody{padding:22px}.close{float:right}.notice{padding:13px;background:#302311;border:1px solid #6e4c1a;border-radius:10px;color:#f5dda6}@media(max-width:900px){.side{display:none}.main{margin:0;padding:15px 15px 88px}.bottom{display:flex;position:fixed;z-index:5;bottom:0;left:0;right:0;background:#091725;border-top:1px solid var(--line);justify-content:space-around;padding:8px}.bottom button{border:0;background:none;color:#9fb3c9;font-size:12px;padding:8px}.bottom button.active{color:#5da2ff}.stats{grid-template-columns:repeat(2,1fr)}.phases{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,1fr)}.exercise{grid-template-columns:105px 1fr}.exercise img{width:105px;height:100%}.exercise .sets{grid-column:1/-1;padding-top:0}.hero h1{font-size:32px}.heroText{padding:28px}.hero{min-height:330px;background-position:60% center}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Strength <span>Trainer</span></div><nav class="nav" id="desktopNav"></nav></aside><main class="main"><section id="overview" class="page active"></section><section id="workouts" class="page"></section><section id="exercises" class="page"></section><section id="progress" class="page"></section><section id="schedule" class="page"></section><section id="guide" class="page"></section></main><nav class="bottom" id="mobileNav"></nav></div><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><script>
const E=[{id:'floor-press',n:'Dumbbell Floor Press',g:'Chest and triceps',how:'Lie on your back with knees bent. Press both dumbbells above your chest, then lower until your upper arms gently touch the floor.',mistake:'Avoid flaring your elbows directly out to the sides.'},{id:'shoulder-press',n:'Standing Shoulder Press',g:'Shoulders and triceps',how:'Brace your core and press both dumbbells overhead. Lower under control without leaning backwards.',mistake:'Keep your ribs down and avoid arching your lower back.'},{id:'chest-fly',n:'Dumbbell Chest Fly',g:'Chest',how:'Lie on your back with a soft bend in your elbows. Open your arms slowly, then bring the dumbbells together above your chest.',mistake:'Do not lower beyond a comfortable shoulder range.'},{id:'lateral-raise',n:'Lateral Raise',g:'Side shoulders',how:'Stand tall and raise the dumbbells out to the sides until near shoulder height. Lower slowly.',mistake:'Avoid shrugging or swinging the weights.'},{id:'triceps-extension',n:'Overhead Triceps Extension',g:'Triceps',how:'Hold one dumbbell overhead. Bend your elbows to lower it behind your head, then straighten your arms.',mistake:'Keep your elbows pointing mostly forward.'},{id:'wall-pushup',n:'Incline Wall Push Up',g:'Chest, shoulders and triceps',how:'Place your hands on a wall and keep a straight body line. Lower your chest towards the wall, then press away.',mistake:'Do not let your hips sag.'},{id:'one-arm-row',n:'One Arm Dumbbell Row',g:'Back and biceps',how:'Support one hand on a sturdy chair. Pull the dumbbell towards your hip, pause, then lower slowly.',mistake:'Keep your torso still and shoulder away from your ear.'},{id:'pullover',n:'Dumbbell Pullover',g:'Chest, back and core',how:'Lie on your back and hold one dumbbell above your chest. Lower it behind your head within a comfortable range, then return.',mistake:'Keep your ribs controlled and avoid forcing the range.'},{id:'reverse-fly',n:'Reverse Fly',g:'Rear shoulders and upper back',how:'Hinge at your hips with a neutral back. Open your arms out wide, then lower slowly.',mistake:'Use control rather than momentum.'},{id:'biceps-curl',n:'Dumbbell Biceps Curl',g:'Biceps',how:'Keep your elbows close to your sides. Curl the dumbbells towards your shoulders and lower fully.',mistake:'Avoid leaning or swinging.'},{id:'hammer-curl',n:'Hammer Curl',g:'Biceps and forearms',how:'Keep your palms facing inward. Curl the dumbbells while keeping your elbows still.',mistake:'Do not let your elbows drift forwards.'},{id:'rear-delt-row',n:'Rear Delt Row',g:'Rear shoulders and upper back',how:'Hinge forward and pull your elbows out wide. Pause briefly, then lower with control.',mistake:'Avoid rounding your lower back.'}];
const push=E.slice(0,6),pull=E.slice(6),P=[['Foundation','Weeks 1–3',3,12,90],['Progression','Weeks 4–7',4,15,60],['Peak','Weeks 8–10',5,18,45]];let S=JSON.parse(localStorage.getItem('strengthV3')||'{"sets":{},"rest":{}}');const save=()=>{localStorage.setItem('strengthV3',JSON.stringify(S));render()};const phase=w=>w<=3?P[0]:w<=7?P[1]:P[2];const type=d=>d===3||d===6?'Recovery':d%2?'Push':'Pull';const dkey=(w,d)=>w+'-'+d;function complete(w,d){if(type(d)==='Recovery')return !!S.rest[dkey(w,d)];let p=phase(w),a=type(d)==='Push'?push:pull;return a.every((e,i)=>Array.from({length:p[2]},(_,s)=>S.sets[`${w}-${d}-${i}-${s}`]).every(Boolean))}function stats(){let days=0;for(let w=1;w<=10;w++)for(let d=1;d<=7;d++)days+=complete(w,d)?1:0;return [days,Object.values(S.sets).filter(Boolean).length]}
const pages=[['overview','Overview','⌂'],['workouts','Workouts','◉'],['exercises','Exercises','▦'],['progress','Progress','↗'],['schedule','Schedule','▣'],['guide','Guide','ⓘ']];function nav(){let h=pages.map(x=>`<button data-id="${x[0]}" onclick="show('${x[0]}')">${x[2]} &nbsp; ${x[1]}</button>`).join('');desktopNav.innerHTML=h;mobileNav.innerHTML=pages.slice(0,5).map(x=>`<button data-id="${x[0]}" onclick="show('${x[0]}')">${x[2]}<br>${x[1]}</button>`).join('')}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-id]').forEach(x=>x.classList.toggle('active',x.dataset.id===id));scrollTo(0,0)}
function render(){let [days,sets]=stats(),pc=Math.round(days/70*100);overview.innerHTML=`<div class="hero"><div class="heroText"><p>10 WEEK HOME PROGRAM</p><h1>Build a stronger upper body</h1><p>Structured push and pull sessions, progressive phases, guided exercise technique and offline progress tracking.</p><button class="btn primary" onclick="nextWorkout()">Start next workout</button></div></div><div class="stats"><div class="card stat"><div class="ico">▣</div><b>10 weeks</b><span class="muted">Program length</span></div><div class="card stat"><div class="ico">✓</div><b>${days}/70</b><span class="muted">Days complete</span></div><div class="card stat"><div class="ico">◉</div><b>${sets}</b><span class="muted">Sets complete</span></div><div class="card stat"><div class="ico">↗</div><b>${pc}%</b><span class="muted">Overall progress</span></div></div><h2>Program phases</h2><div class="phases">${P.map(p=>`<div class="card phase"><p>${p[1]}</p><h3>${p[0]}</h3><p>${p[2]} sets × ${p[3]} reps<br>${p[4]} seconds rest</p></div>`).join('')}</div>`;
exercises.innerHTML=`<div class="top"><div><h1>Exercise library</h1><p>Technique, target areas and common mistakes.</p></div></div><div class="grid library">${E.map(e=>`<article class="card excard" onclick="details('${e.id}')"><img src="images/${e.id}.webp" alt="Demonstration of ${e.n}"><div><h3>${e.n}</h3><p>${e.g}</p></div></article>`).join('')}</div>`;renderSchedule();renderProgress();guide.innerHTML=`<div class="top"><div><h1>Training guide</h1><p>Simple rules for safe, consistent sessions.</p></div></div><div class="grid"><div class="card"><h2>Before each session</h2><p>Warm up for five minutes with easy arm circles, shoulder rolls and gentle movement. Use a clear floor area and a sturdy chair where required.</p></div><div class="card"><h2>Progressing with 5 kg dumbbells</h2><p>Increase repetitions, slow the lowering phase to three seconds, add a pause or improve your range before adding more load.</p></div><div class="card"><h2>Recovery</h2><p>Use recovery days for light walking and mobility. Prioritise sleep, hydration and regular protein rich meals.</p></div><div class="card"><h2>Safety</h2><div class="notice">Stop if you have sharp pain, dizziness, chest discomfort or unusual shortness of breath. Seek professional advice before training if you have an injury or health concern.</div></div></div><p style="margin-top:18px"><button class="btn" onclick="resetAll()">Reset all progress</button></p>`}
function renderSchedule(){let h='<div class="top"><div><h1>10 week schedule</h1><p>Five training days and two recovery days each week.</p></div></div>';for(let w=1;w<=10;w++){let p=phase(w);h+=`<div class="week ${w===1?'open':''}"><button class="weekhead" onclick="this.parentElement.classList.toggle('open')"><b>Week ${w}: ${p[0]}</b><span>${p[2]} × ${p[3]}⌄</span></button><div class="days">`;for(let d=1;d<=7;d++)h+=`<div class="day ${complete(w,d)?'done':''}" onclick="openWorkout(${w},${d})"><b>Day ${d}</b><p>${type(d)}</p><span>${complete(w,d)?'✓ Complete':'Open'}</span></div>`;h+='</div></div>'}schedule.innerHTML=h}
function renderProgress(){let [days,sets]=stats(),pc=Math.round(days/70*100);progress.innerHTML=`<div class="top"><div><h1>Progress</h1><p>Your completion is stored on this device.</p></div></div><div class="card"><h2>${pc}% complete</h2><div class="bar"><i style="width:${pc}%"></i></div><p style="margin-top:15px">${days} scheduled days and ${sets} exercise sets completed.</p></div><div class="stats">${P.map((p,i)=>{let a=i===0?1:i===1?4:8,b=i===0?3:i===1?7:10,c=0,t=(b-a+1)*7;for(let w=a;w<=b;w++)for(let d=1;d<=7;d++)c+=complete(w,d)?1:0;return `<div class="card stat"><b>${c}/${t}</b><span class="muted">${p[0]}</span></div>`}).join('')}</div>`}
function nextWorkout(){for(let w=1;w<=10;w++)for(let d=1;d<=7;d++)if(!complete(w,d))return openWorkout(w,d)}function openWorkout(w,d){let t=type(d),p=phase(w);show('workouts');if(t==='Recovery'){workouts.innerHTML=`<button class="btn" onclick="show('schedule')">Back</button><div class="card" style="margin-top:15px"><h1>Week ${w}, Day ${d}: Recovery</h1><p>Take an easy walk, complete gentle shoulder mobility and focus on sleep and hydration.</p><button class="btn primary" onclick="S.rest['${dkey(w,d)}']=!S.rest['${dkey(w,d)}'];save();openWorkout(${w},${d})">${S.rest[dkey(w,d)]?'Mark incomplete':'Complete recovery day'}</button></div>`;return}let a=t==='Push'?push:pull;workouts.innerHTML=`<button class="btn" onclick="show('schedule')">Back</button><div class="top" style="margin-top:18px"><div><h1>Week ${w}, Day ${d}: ${t}</h1><p>${p[0]} · ${p[2]} sets × ${p[3]} reps · ${p[4]} seconds rest</p></div></div><div class="exerciseList">${a.map((e,i)=>`<article class="exercise"><img src="images/${e.id}.webp" alt="Demonstration of ${e.n}" onclick="details('${e.id}')"><div class="info"><h3>${i+1}. ${e.n}</h3><p>${e.how}</p><span class="muted">${e.g}</span></div><div class="sets">${Array.from({length:p[2]},(_,s)=>{let k=`${w}-${d}-${i}-${s}`;return `<button class="set ${S.sets[k]?'done':''}" onclick="S.sets['${k}']=!S.sets['${k}'];save();openWorkout(${w},${d})">${s+1}</button>`}).join('')}</div></article>`).join('')}</div>`}
function details(id){let e=E.find(x=>x.id===id);modalbox.innerHTML=`<img src="images/${e.id}.webp" alt="Demonstration of ${e.n}"><div class="modalbody"><button class="btn close" onclick="modal.classList.remove('open')">Close</button><h2>${e.n}</h2><p><b>Target areas:</b> ${e.g}</p><h3>How to perform</h3><p>${e.how}</p><h3>Common mistake</h3><p>${e.mistake}</p></div>`;modal.classList.add('open')}function resetAll(){if(confirm('Reset all saved progress?')){S={sets:{},rest:{}};save();show('overview')}}modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};nav();render();show('overview');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
